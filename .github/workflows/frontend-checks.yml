name: Frontend checks

on:
  push:
    branches:
      - strategy-a-trend-pullback-v2
    paths:
      - "frontend/trading-ui/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "frontend/trading-ui/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/trading-ui

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/trading-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
